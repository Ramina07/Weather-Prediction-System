<svg viewBox="0 0 1200 320" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMax slice" style="width:100%;height:100%;display:block">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#CFFAFE"/>
      <stop offset="0.55" stop-color="#ECFEFF"/>
      <stop offset="1" stop-color="#F8FAFC"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FDE68A"/>
      <stop offset="1" stop-color="#FDE68A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="haze" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#94A3B8" stop-opacity="0"/>
      <stop offset="1" stop-color="#94A3B8" stop-opacity="0.35"/>
    </linearGradient>
    <linearGradient id="far" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5EAAA8"/>
      <stop offset="1" stop-color="#3F8F8C"/>
    </linearGradient>
    <linearGradient id="near" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0F766E"/>
      <stop offset="1" stop-color="#0B4F4A"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FDE68A"/>
      <stop offset="1" stop-color="#F59E0B"/>
    </linearGradient>
    <style>
      .p { fill: #475569; opacity: .35; animation: drift 14s linear infinite; }
      .p2 { animation-duration: 19s; animation-delay: -6s; }
      .p3 { animation-duration: 24s; animation-delay: -11s; }
      @keyframes drift { 0% { transform: translate(0, 0); opacity: 0; } 10% { opacity: .45; }
        90% { opacity: .35; } 100% { transform: translate(140px, -90px); opacity: 0; } }
      .cloud { fill: #FFFFFF; opacity: .85; animation: float 40s ease-in-out infinite alternate; }
      @keyframes float { from { transform: translateX(-30px); } to { transform: translateX(60px); } }
    </style>
  </defs>
  <rect width="1200" height="320" fill="url(#sky)"/>
  <circle cx="1010" cy="80" r="90" fill="url(#sun)"/>
  <circle cx="1010" cy="80" r="30" fill="#FCD34D" opacity=".9"/>
  <g class="cloud"><ellipse cx="820" cy="70" rx="60" ry="14"/><ellipse cx="850" cy="60" rx="34" ry="14"/></g>
  <g class="cloud" style="animation-duration:55s"><ellipse cx="600" cy="45" rx="48" ry="11"/><ellipse cx="625" cy="37" rx="26" ry="11"/></g>
  <!-- far skyline -->
  <path fill="url(#far)" opacity=".55" d="M560 320 V230 h30 v-25 h22 v40 h18 v-60 h26 v60 h16 v-35 h30 v55 h20 v-80 h24 v80 h18 v-45 h34 v45 h20 v-30 h26 v30 h22 v-65 h28 v65 h20 v-40 h30 v40 h24 v-55 h26 v55 h20 v-28 h30 v28 h24 V320 Z"/>
  <!-- tower with sphere (stylised) -->
  <g transform="translate(860 0)">
    <path d="M-14 320 C-12 260 -8 210 -18 150 L-4 150 L0 120 L4 150 L18 150 C8 210 12 260 14 320 Z" fill="url(#near)"/>
    <path d="M-18 150 C-30 140 -34 128 -32 118 M18 150 C30 140 34 128 32 118" stroke="#0F766E" stroke-width="5" fill="none"/>
    <circle cx="0" cy="108" r="19" fill="url(#gold)"/>
    <circle cx="-6" cy="102" r="6" fill="#FFFFFF" opacity=".55"/>
  </g>
  <!-- pyramid -->
  <path d="M960 320 L1015 236 L1070 320 Z" fill="#0E6A63"/>
  <path d="M1015 236 L1070 320 L1040 320 Z" fill="#0B5751"/>
  <!-- near skyline -->
  <path fill="url(#near)" d="M600 320 V268 h40 v-18 h26 v70 h12 v-92 h34 v92 h16 v-52 h40 v52 h14 v-34 h30 v34 h18 v-70 h22 v70 h12 V320 Z"/>
  <path fill="url(#near)" d="M900 320 V262 h30 v-30 h24 v88 Z M1080 320 V250 h26 v-22 h20 v92 Z M1130 320 V270 h40 v50 Z"/>
  <!-- windows -->
  <g fill="#FDE68A" opacity=".75">
    <rect x="716" y="244" width="4" height="6"/><rect x="726" y="258" width="4" height="6"/><rect x="716" y="272" width="4" height="6"/>
    <rect x="770" y="282" width="4" height="6"/><rect x="782" y="296" width="4" height="6"/><rect x="866" y="270" width="4" height="6"/>
    <rect x="1094" y="262" width="4" height="6"/><rect x="1104" y="276" width="4" height="6"/>
  </g>
  <rect width="1200" height="320" fill="url(#haze)"/>
  <!-- PM2.5 particles -->
  <g>
    <circle class="p" cx="640" cy="250" r="3"/><circle class="p p2" cx="700" cy="270" r="2"/>
    <circle class="p p3" cx="760" cy="240" r="2.5"/><circle class="p" cx="820" cy="280" r="2" style="animation-delay:-4s"/>
    <circle class="p p2" cx="900" cy="230" r="3"/><circle class="p p3" cx="980" cy="260" r="2"/>
    <circle class="p" cx="1040" cy="210" r="2.5" style="animation-delay:-9s"/><circle class="p p2" cx="1100" cy="250" r="2"/>
    <circle class="p p3" cx="680" cy="210" r="1.8"/><circle class="p" cx="940" cy="290" r="1.8" style="animation-delay:-2s"/>
    <circle class="p p2" cx="1150" cy="220" r="2.2"/><circle class="p p3" cx="590" cy="280" r="2.2"/>
  </g>
</svg>
